<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>Aurora Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:               #1a1a1a;
  --surface:          #242424;
  --surface2:         #2e2e2e;
  --border:           #3a3a3a;
  --text-primary:     #f0f0f0;
  --text-secondary:   #a0a0a0;
  --accent:           #ff8c69;
  --user-bg:          #1e3a5f;
  --user-border:      #2a5a8a;
  --assistant-bg:     #242424;
  --assistant-border: #3a3a3a;
  --input-bg:         #1e1e1e;
  --input-border:     #444;
  --radius:           16px;
  --radius-sm:        8px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
}

/* ── App shell ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
}

/* ── Message list ── */
#message-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px 4px;
  -webkit-overflow-scrolling: touch;
}
#message-list::-webkit-scrollbar { width: 0; }

/* ── Message ── */
.msg {
  display: flex;
  margin-bottom: 10px;
  animation: fadeUp .15s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg.user      { justify-content: flex-end; }
.msg.assistant { justify-content: flex-start; }
.msg.system    { justify-content: center; }

.bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: var(--radius);
  word-break: break-word;
  white-space: pre-wrap;
  -webkit-touch-callout: none;
  user-select: none;
}
.msg.user .bubble {
  background: var(--user-bg);
  border: 1px solid var(--user-border);
  border-bottom-right-radius: var(--radius-sm);
}
.msg.assistant .bubble {
  background: var(--assistant-bg);
  border: 1px solid var(--assistant-border);
  border-bottom-left-radius: var(--radius-sm);
}
.msg.system .bubble {
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  max-width: 100%;
  text-align: center;
}

/* ── Reasoning ── */
.reasoning-block {
  background: rgba(255,255,255,.04);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 7px 10px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}
.reasoning-label {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 3px;
  letter-spacing: .05em;
}
.reasoning-text { white-space: pre-wrap; word-break: break-word; }
.reasoning-block.collapsed .reasoning-text { display: none; }

/* ── Streaming cursor ── */
.cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink .8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Markdown ── */
.content p              { margin-bottom: 6px; }
.content p:last-child   { margin-bottom: 0; }
.content h1             { font-size: 1.3em; font-weight: 600; margin: 8px 0 4px; }
.content h2             { font-size: 1.15em; font-weight: 600; margin: 8px 0 4px; }
.content h3             { font-size: 1.05em; font-weight: 600; margin: 8px 0 4px; }
.content code           { background: rgba(255,255,255,.08); border-radius: 4px;
                          padding: 1px 5px; font-size: 13px;
                          font-family: "Fira Code", monospace; }
.content pre            { background: #0d0d0d; border: 1px solid var(--border);
                          border-radius: var(--radius-sm); padding: 10px 12px;
                          overflow-x: auto; margin: 6px 0; font-size: 13px; }
.content pre code       { background: none; padding: 0; }
.content strong         { font-weight: 600; color: #fff; }
.content em             { font-style: italic; color: #d0d0d0; }
.content ul, .content ol { padding-left: 20px; margin: 4px 0; }
.content li             { margin-bottom: 2px; }
.content blockquote     { border-left: 3px solid var(--border);
                          padding-left: 10px; color: var(--text-secondary); margin: 6px 0; }
.content hr             { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
.content a              { color: var(--accent); text-decoration: none; }
.content table          { border-collapse: collapse; width: 100%;
                          margin: 6px 0; font-size: 13px; }
.content th, .content td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.content th             { background: rgba(255,255,255,.05); }

/* ── Input area ── */
#input-area {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px;
  background: var(--input-bg);
  border-top: 1px solid var(--border);
  /* Respect system navigation bar */
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

#input-box {
  flex: 1;
  min-height: 40px;
  max-height: 120px;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--input-border);
  border-radius: 20px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  line-height: 1.4;
  resize: none;
  outline: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#input-box::placeholder { color: var(--text-secondary); }
#input-box:focus        { border-color: var(--accent); }

#send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform .1s, opacity .1s;
  -webkit-tap-highlight-color: transparent;
}
#send-btn:active  { transform: scale(.9); }
#send-btn.busy    { opacity: .4; pointer-events: none; }

/* Send icon (SVG arrow) */
#send-btn svg { width: 18px; height: 18px; fill: currentColor; }
</style>
</head>
<body>
<div id="app">
  <!-- Message list -->
  <div id="message-list"></div>

  <!-- Input area -->
  <div id="input-area">
    <textarea
      id="input-box"
      placeholder="发送消息..."
      rows="1"
    ></textarea>
    <button id="send-btn" title="发送">
      <svg viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── State ────────────────────────────────────────────────────
  var messages      = [];
  var streamingId   = null;
  var streamContent = '';
  var streamReason  = '';
  var isGenerating  = false;

  var listEl    = document.getElementById('message-list');
  var inputEl   = document.getElementById('input-box');
  var sendBtn   = document.getElementById('send-btn');

  // ── Send to Kotlin ───────────────────────────────────────────
  function send(type, payload) {
    try {
      if (window.__auroraBridge) {
        window.__auroraBridge.onMessage(
          JSON.stringify({ type: type, payload: payload || {} })
        );
      } else {
        console.warn('[Bridge] __auroraBridge not ready, type=' + type);
      }
    } catch (e) {
      console.error('[Bridge] send error:', e);
    }
  }

  // ── Dispatch from Kotlin ─────────────────────────────────────
  window.__auroraDispatch = function (type, payload) {
    try {
      switch (type) {
        case 'setMessages':   onSetMessages(payload);   break;
        case 'appendToken':   onAppendToken(payload);   break;
        case 'streamEnd':     onStreamEnd(payload);     break;
        case 'streamError':   onStreamError(payload);   break;
        case 'setGenerating': onSetGenerating(payload); break;
        case 'clearMessages': onClearMessages();        break;
        case 'updateMessage':
            onUpdateMessage(payload);
            break;
        case 'removeMessage':
            onRemoveMessage(payload);
            break;
        default: console.warn('[Bridge] unknown type:', type);
      }
    } catch (e) {
      console.error('[Bridge] dispatch error type=' + type, e);
    }
  };

  // ── Handlers ─────────────────────────────────────────────────
  function onSetMessages(payload) {
    messages = payload.messages || [];
    renderAll();
    scrollBottom(false);
  }

  function onAppendToken(payload) {
    var id  = payload.id;
    var tok = payload.token || '';
    var isR = !!payload.isReasoning;

    if (streamingId !== id) {
      streamingId   = id;
      streamContent = '';
      streamReason  = '';
      if (!document.getElementById('msg-' + id)) {
        var m = { id: id, role: 'assistant', content: '', reasoning: '' };
        messages.push(m);
        appendMsgEl(m);
      }
    }

    if (isR) streamReason  += tok;
    else      streamContent += tok;

    updateBubble(id, streamContent, streamReason, true);
    scrollIfNear();
  }

  function onStreamEnd(payload) {
    var id = payload.id || streamingId;
    if (id) {
      updateBubble(id, streamContent, streamReason, false);
      var m = messages.find(function (x) { return x.id === id; });
      if (m) { m.content = streamContent; m.reasoning = streamReason; }
    }
    streamingId = null; streamContent = ''; streamReason = '';
    scrollBottom(true);
  }

  function onStreamError(payload) {
    var id  = payload.id || streamingId;
    var txt = '[生成失败: ' + (payload.error || '未知') + ']';
    if (id) updateBubble(id, txt, '', false);
    streamingId = null; streamContent = ''; streamReason = '';
  }

  function onSetGenerating(payload) {
    isGenerating = !!payload.generating;
    sendBtn.classList.toggle('busy', isGenerating);
  }

  function onClearMessages() {
    messages = [];
    listEl.innerHTML = '';
  }

  // ── Handler: updateMessage ────────────────────────────────────
  // payload: { id, content, reasoning? }
  function onUpdateMessage(payload) {
    var id = payload.id;
    var content = payload.content || '';
    var reasoning = payload.reasoning || '';

    // Update in-memory array
    var msg = messages.find(function(m) { return m.id === id; });
    if (msg) {
      msg.content = content;
      msg.reasoning = reasoning;
    }

    // Re-render bubble in place
    updateBubble(id, content, reasoning, false);
  }

  // ── Handler: removeMessage ────────────────────────────────────
  // payload: { id }
  function onRemoveMessage(payload) {
    var id = payload.id;

    // Remove from in-memory array
    messages = messages.filter(function(m) { return m.id !== id; });

    // Remove DOM element
    var el = document.getElementById('msg-' + id);
    if (el) {
      el.remove();
    }
  }

  // ── Render all ────────────────────────────────────────────────
  function renderAll() {
    listEl.innerHTML = '';
    messages.forEach(appendMsgEl);
  }

  // ── Append one message element ────────────────────────────────
  function appendMsgEl(msg) {
    var div    = document.createElement('div');
    div.className = 'msg ' + (msg.role || 'assistant');
    div.id    = 'msg-' + msg.id;
    div.dataset.id = msg.id;
    div.dataset.role = msg.role || 'assistant';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (msg.reasoning && msg.reasoning.length > 0) {
      bubble.appendChild(mkReasoning(msg.reasoning, false));
    }

    var cDiv = document.createElement('div');
    cDiv.className = 'content';
    cDiv.innerHTML = renderMd(msg.content || '');
    bubble.appendChild(cDiv);

    div.appendChild(bubble);
    listEl.appendChild(div);
  }

  // ── Update streaming bubble ────────────────────────────────────
  function updateBubble(id, content, reasoning, cursor) {
    var div = document.getElementById('msg-' + id);
    if (!div) return;
    var bubble = div.querySelector('.bubble');
    if (!bubble) return;

    bubble.innerHTML = '';

    if (reasoning && reasoning.length > 0) {
      bubble.appendChild(mkReasoning(reasoning, cursor && content.length === 0));
    }

    var cDiv = document.createElement('div');
    cDiv.className = 'content';
    cDiv.innerHTML = renderMd(content || '');
    if (cursor && content.length > 0) {
      var cur = document.createElement('span');
      cur.className = 'cursor';
      cDiv.appendChild(cur);
    }
    bubble.appendChild(cDiv);
  }

  // ── Reasoning element ─────────────────────────────────────────
  function mkReasoning(text, showCursor) {
    var block = document.createElement('div');
    block.className = 'reasoning-block';

    var lbl = document.createElement('div');
    lbl.className = 'reasoning-label';
    lbl.textContent = '思考过程（点击折叠）';
    block.appendChild(lbl);

    var body = document.createElement('div');
    body.className = 'reasoning-text';
    body.textContent = text;
    if (showCursor) {
      var cur = document.createElement('span');
      cur.className = 'cursor';
      body.appendChild(cur);
    }
    block.appendChild(body);

    block.addEventListener('click', function () {
      block.classList.toggle('collapsed');
    });
    return block;
  }

  // ── Scroll ────────────────────────────────────────────────────
  function scrollBottom(smooth) {
    if (smooth) listEl.scrollTo({ top: listEl.scrollHeight, behavior: 'smooth' });
    else        listEl.scrollTop = listEl.scrollHeight;
  }

  function scrollIfNear() {
    var dist = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight;
    if (dist < 150) listEl.scrollTop = listEl.scrollHeight;
  }

  // ── Input: send on button click ───────────────────────────────
  sendBtn.addEventListener('click', doSend);

  // Input: Ctrl+Enter or Enter (without Shift) on physical keyboard
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
      e.preventDefault();
      doSend();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  function doSend() {
    if (isGenerating) return;
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    send('userInput', { text: text });
  }

  // ── Minimal Markdown renderer ─────────────────────────────────
  function renderMd(text) {
    if (!text) return '';
    var h = esc(text);

    // Fenced code blocks
    h = h.replace(/```[\w]*\n?([\s\S]*?)```/g, function (_, c) {
      return '<pre><code>' + c.trim() + '</code></pre>';
    });

    h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    h = h.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    h = h.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g,     '<em>$1</em>');
    h = h.replace(/`([^`\n]+)`/g,   '<code>$1</code>');
    h = h.replace(/^&gt; (.+)$/gm,  '<blockquote>$1</blockquote>');
    h = h.replace(/^---+$/gm,       '<hr>');

    // Unordered list
    h = h.replace(/(^- .+\n?)+/gm, function (block) {
      return '<ul>' + block.trim().split('\n').map(function (l) {
        return '<li>' + l.replace(/^- /, '') + '</li>';
      }).join('') + '</ul>';
    });

    // Ordered list
    h = h.replace(/(^\d+\. .+\n?)+/gm, function (block) {
      return '<ol>' + block.trim().split('\n').map(function (l) {
        return '<li>' + l.replace(/^\d+\. /, '') + '</li>';
      }).join('') + '</ol>';
    });

    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2" target="_blank">$1</a>');

    // Paragraphs
    h = h.replace(/\n\n+/g, '</p><p>');
    h = '<p>' + h + '</p>';
    h = h.replace(/\n/g, '<br>');
    h = h.replace(/<p>\s*<\/p>/g, '');
    h = h.replace(/<p>(<(?:ul|ol|pre|h[1-6]|blockquote|hr))/g, '$1');
    h = h.replace(/(<\/(?:ul|ol|pre|h[1-6]|blockquote)>)<\/p>/g, '$1');
    return h;
  }

  function esc(t) {
    return t.replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
  }

  // ── Ready ─────────────────────────────────────────────────────
  // Try to send ready immediately AND on window load,
  // in case __auroraBridge is registered before or after DOM load.
  // ── Long-press detection ──────────────────────────────────────
  // Uses pointer events on #message-list (event delegation).
  // A press held for 500ms without moving triggers messageLongPress.
  // Moving more than 8px cancels the timer (user is scrolling).

  (function() {
      var LONG_PRESS_MS = 500;
      var MOVE_THRESHOLD = 8;
      var timer = null;
      var startX = 0;
      var startY = 0;
      var targetId = null;

      function findMsgEl(el) {
          // Walk up the DOM to find the .msg element with data-id
          while (el && el !== listEl) {
              if (el.dataset && el.dataset.id) return el;
              el = el.parentElement;
          }
          return null;
      }

      function cancel() {
          if (timer) {
              clearTimeout(timer);
              timer = null;
          }
          targetId = null;
      }

      listEl.addEventListener('pointerdown', function(e) {
          cancel();
          var msgEl = findMsgEl(e.target);
          if (!msgEl) return;

          // Only trigger on bubble, not on reasoning-block toggle
          if (e.target.closest('.reasoning-block')) return;

          targetId = msgEl.dataset.id;
          startX = e.clientX;
          startY = e.clientY;

          timer = setTimeout(function() {
              timer = null;
              if (targetId) {
                  send('messageLongPress', { id: targetId });
                  targetId = null;
              }
          }, LONG_PRESS_MS);
      });

      listEl.addEventListener('pointermove', function(e) {
          if (!timer) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          if (dx * dx + dy * dy > MOVE_THRESHOLD * MOVE_THRESHOLD) {
              cancel();
          }
      });

      listEl.addEventListener('pointerup',     cancel);
      listEl.addEventListener('pointercancel', cancel);
  })();

  function tryReady() {
    if (window.__auroraBridge) {
      send('ready', {});
      console.log('[Aurora] ready sent');
    } else {
      // Bridge not yet registered, retry after short delay
      setTimeout(tryReady, 100);
    }
  }

  // Start trying immediately
  tryReady();

  // Also try on window load as a fallback
  window.addEventListener('load', function () {
    send('ready', {});
  });

})();
</script>
</body>
</html>
